<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e60064" />
    <title>Offline - EcomOS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff8fb; color: #172033; font-family: Inter, sans-serif; }
      .container { max-width: 500px; padding: 24px; text-align: center; }
      h1 { font-size: 2rem; margin-bottom: 1rem; }
      p { color: #5d6678; line-height: 1.75; }
      a { color: #e60064; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Offline</h1>
      <p>You're currently offline. EcomOS is ready to reconnect once your network is back.</p>
      <p>Please check your connection, then refresh this page.</p>
      <p><a href="https://www.ecomos.ma/">Go back to home</a></p>
    </div>
    <script>
      let isRecovering = false;
      async function checkConnection() {
        if (isRecovering || !navigator.onLine) return;
        try {
          await fetch(`https://www.ecomos.ma/favicon.png?offline-check=${Date.now()}`, {
            mode: "no-cors",
            cache: "no-store"
          });
          isRecovering = true;
          window.location.replace("https://www.ecomos.ma/");
        } catch {
          // Keep showing the offline page until the site can be reached.
        }
      }
      window.addEventListener("online", checkConnection);
      window.setInterval(checkConnection, 10000);
      void checkConnection();
    </script>
  </body>
</html>
